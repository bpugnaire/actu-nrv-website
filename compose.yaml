name: nice-rendezvous

services:
  db:
    image: mysql:8.0.43
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ghost}
      MYSQL_USER: ${MYSQL_USER:-ghost}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ghost-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-only}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - private

  ghost:
    image: ghost:6.62.0-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:2368:2368"
    environment:
      NODE_ENV: production
      url: ${SITE_URL:-http://localhost:2368}
      database__client: mysql
      database__connection__host: db
      database__connection__user: ${MYSQL_USER:-ghost}
      database__connection__password: ${MYSQL_PASSWORD:-ghost-local-only}
      database__connection__database: ${MYSQL_DATABASE:-ghost}
      privacy__useUpdateCheck: "false"
      privacy__useGravatar: "false"
      # Local-only inbox for Ghost sign-in codes and newsletter previews.
      mail__transport: SMTP
      mail__from: "Nice RendezVous <preview@nicerendezvous.local>"
      mail__options__host: mailpit
      mail__options__port: 1025
      mail__options__secure: "false"
    volumes:
      - ghost-content:/var/lib/ghost/content
      # Ghost validates ownership when it starts, so the development bind mount
      # must be writable. Production receives a built theme artifact instead.
      - ./theme:/var/lib/ghost/content/themes/nice-rendezvous
    networks:
      - public
      - private

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - public
      - private

volumes:
  mysql-data:
  ghost-content:

networks:
  public:
  private:
    internal: true
